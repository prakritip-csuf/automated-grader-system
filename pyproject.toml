[project]
name = "automated_answer_grader"
version = "0.1.0"
description = "Automated Answer Grader: an OCR and NLP-based system for short-answer evaluation."
readme = "README.md"
authors = [
    { name = "prakritip-csuf", email = "prakritip@csu.fullerton.edu" }
]
requires-python = ">=3.13, <3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "jiwer>=4.0.0",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "pymupdf>=2.0",
    "python-multipart>=0.0.32",
    "sentence-transformers>=6.2.0",
    "sentencepiece>=0.2.2",
    "torch>=2.14.1",
    "transformers>=5.19.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
addopts = "-ra -q --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
    "UP",
]

[tool.ruff.lint.isort]
known-first-party = ["automated_answer_grader"]

[tool.ruff.format]
docstring-code-format = true

[tool.coverage.run]
branch = true
source = ["automated_answer_grader"]

[tool.coverage.report]
show_missing = true
skip_covered = true
